<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 760" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e8bd8"/>
      <stop offset=".42" stop-color="#35b6f2"/>
      <stop offset=".75" stop-color="#8fe3b8"/>
      <stop offset="1" stop-color="#cdf0a4"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff8c9" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#ffefa8" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ffefa8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ae61e"/>
      <stop offset="1" stop-color="#58cc02"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58cc02"/>
      <stop offset="1" stop-color="#3f9e00"/>
    </linearGradient>
    <linearGradient id="balloon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a80"/>
      <stop offset="1" stop-color="#e84855"/>
    </linearGradient>
    <path id="spark" d="M0,-9 C1.2,-2.6 2.6,-1.2 9,0 C2.6,1.2 1.2,2.6 0,9 C-1.2,2.6 -2.6,1.2 -9,0 C-2.6,-1.2 -1.2,-2.6 0,-9 Z"/>
  </defs>

  <rect width="420" height="760" fill="url(#sky)"/>

  <!-- 太阳与光晕 -->
  <circle cx="332" cy="88" r="92" fill="url(#glow)"/>
  <circle cx="332" cy="88" r="34" fill="#ffe066"/>
  <circle cx="332" cy="88" r="27" fill="#ffd43b"/>

  <!-- 星星与闪光 -->
  <g fill="#ffffff">
    <use href="#spark" transform="translate(52 64) scale(.9)" opacity=".95"/>
    <use href="#spark" transform="translate(150 36) scale(.55)" opacity=".8"/>
    <use href="#spark" transform="translate(246 120) scale(.7)" opacity=".85"/>
    <use href="#spark" transform="translate(96 178) scale(.5)" opacity=".7"/>
    <use href="#spark" transform="translate(382 190) scale(.6)" opacity=".75"/>
    <use href="#spark" transform="translate(30 300) scale(.45)" opacity=".6"/>
    <circle cx="112" cy="110" r="2.6" opacity=".9"/>
    <circle cx="204" cy="72" r="2" opacity=".7"/>
    <circle cx="286" cy="42" r="2.4" opacity=".8"/>
    <circle cx="70" cy="240" r="2" opacity=".6"/>
    <circle cx="362" cy="266" r="2.2" opacity=".65"/>
    <circle cx="176" cy="200" r="1.8" opacity=".55"/>
  </g>

  <!-- 云 -->
  <g fill="#ffffff">
    <g opacity=".95">
      <ellipse cx="86" cy="128" rx="44" ry="18"/>
      <ellipse cx="118" cy="118" rx="30" ry="16"/>
      <ellipse cx="56" cy="120" rx="24" ry="13"/>
    </g>
    <g opacity=".8">
      <ellipse cx="300" cy="216" rx="38" ry="14"/>
      <ellipse cx="326" cy="208" rx="24" ry="12"/>
    </g>
    <g opacity=".6">
      <ellipse cx="150" cy="300" rx="30" ry="10"/>
      <ellipse cx="170" cy="294" rx="18" ry="9"/>
    </g>
  </g>

  <!-- 热气球 -->
  <g transform="translate(74 206)">
    <path d="M0,-30 C20,-30 30,-14 30,2 C30,18 16,30 8,36 L-8,36 C-16,30 -30,18 -30,2 C-30,-14 -20,-30 0,-30 Z" fill="url(#balloon)"/>
    <path d="M0,-30 C8,-30 12,-12 12,2 C12,16 6,28 4,34 L-4,34 C-6,28 -12,16 -12,2 C-12,-12 -8,-30 0,-30 Z" fill="#ffd43b" opacity=".92"/>
    <path d="M-12,36 L-8,48 M12,36 L8,48" stroke="#8d5a2b" stroke-width="2"/>
    <rect x="-9" y="46" width="18" height="12" rx="3" fill="#a86a33"/>
    <rect x="-9" y="46" width="18" height="4" rx="2" fill="#8d5a2b"/>
  </g>

  <!-- 飞鸟 -->
  <g stroke="#0b5f8a" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55">
    <path d="M228 160 Q234 152 240 160 Q246 152 252 160"/>
    <path d="M268 138 Q273 131 278 138 Q283 131 288 138"/>
  </g>

  <!-- 远山 -->
  <path d="M0 582 Q 70 536 160 572 T 420 560 V760 H0 Z" fill="#b5e61e" opacity=".8"/>
  <!-- 近山两层 -->
  <path d="M0 612 Q 96 558 200 606 T 420 592 V760 H0 Z" fill="url(#hillA)"/>
  <path d="M0 668 Q 130 616 260 664 T 420 650 V760 H0 Z" fill="url(#hillB)"/>

  <!-- 山间小路 -->
  <path d="M210 760 C 196 720 236 706 216 682 C 200 662 232 650 222 632"
        stroke="#e9f7c9" stroke-width="14" fill="none" stroke-linecap="round" opacity=".85"/>

  <!-- 灌木与花 -->
  <g>
    <ellipse cx="46" cy="700" rx="34" ry="16" fill="#3f9e00"/>
    <ellipse cx="384" cy="726" rx="40" ry="18" fill="#3f9e00"/>
    <ellipse cx="132" cy="736" rx="30" ry="13" fill="#359100"/>
    <ellipse cx="320" cy="676" rx="24" ry="11" fill="#4db502"/>
    <g fill="#ffd43b">
      <circle cx="70" cy="690" r="4"/><circle cx="404" cy="712" r="4"/><circle cx="300" cy="700" r="3.4"/>
    </g>
    <g fill="#ff8a80">
      <circle cx="102" cy="726" r="3.6"/><circle cx="356" cy="742" r="3.6"/>
    </g>
    <g fill="#ffffff">
      <circle cx="250" cy="722" r="3"/><circle cx="160" cy="700" r="2.6"/>
    </g>
  </g>
</svg>
